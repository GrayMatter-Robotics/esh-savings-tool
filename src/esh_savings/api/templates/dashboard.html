<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESH Savings Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { color: #1F3864; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 16px 20px; margin: 16px 0; }
    h2 { margin-top: 0; color: #1F3864; font-size: 1.1em; }
    label { display: block; margin: 8px 0 3px; font-size: 0.9em; }
    input[type=number], input[type=file] { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 4px; }
    .cb-row { display: flex; gap: 20px; margin: 8px 0; }
    .cb-row label { display: flex; align-items: center; gap: 6px; margin: 0; }
    button { background: #1F3864; color: #fff; padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    button:hover { background: #2c5096; }
    button:disabled { background: #999; cursor: not-allowed; }
    #status { font-size: 0.85em; color: #555; margin-top: 6px; }
    #resultCard { display: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    td, th { border: 1px solid #ccc; padding: 7px 12px; text-align: left; }
    th { background: #1F3864; color: #fff; }
    .warn { background: #FFC000; padding: 8px 12px; border-radius: 4px; margin: 8px 0; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>ESH Savings Calculator</h1>
  <p>Quantify Environment, Safety &amp; Health dollar savings of robot sanding vs. manual — grounded in ISO 5349, ACGIH, and OSHA standards.</p>

  <div class="card">
    <h2>1 — Session File</h2>
    <label>Upload sanding session (.hdf5 / .h5)</label>
    <input type="file" id="fileInput" accept=".hdf5,.h5">
    <button onclick="doUpload()">Upload</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>2 — Analysis Settings</h2>
    <label>Operator count</label>
    <input type="number" id="opCount" value="1" min="1" max="9999">
    <label>Shift duration (hours)</label>
    <input type="number" id="shiftHrs" value="8" min="1" max="12" step="0.5">
    <label>Analysis channels</label>
    <div class="cb-row">
      <label><input type="checkbox" id="chkVib" checked> Vibration</label>
      <label><input type="checkbox" id="chkForce" checked> Force</label>
      <label><input type="checkbox" id="chkOrientation" disabled title="Available in Phase 3"> Orientation (Phase 3)</label>
    </div>
    <button id="btnCompute" onclick="doCompute()" disabled>Compute ESH Savings</button>
  </div>

  <div class="card" id="resultCard">
    <h2>3 — Results</h2>
    <div id="resultBody"></div>
    <button onclick="doDownload()">Download Excel Report</button>
  </div>

  <script>
    let sessionId = null;

    async function doUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) { alert('Select a file first.'); return; }
      const fd = new FormData();
      fd.append('file', file);
      setStatus('Uploading...');
      const r = await fetch('/upload', { method: 'POST', body: fd });
      if (!r.ok) { setStatus('Upload failed: ' + r.statusText); return; }
      const data = await r.json();
      sessionId = data.session_id;
      setStatus(`Uploaded — session ${sessionId.slice(0, 8)}…`);
      document.getElementById('btnCompute').disabled = false;
    }

    async function doCompute() {
      if (!sessionId) { alert('Upload a file first.'); return; }
      setStatus('Computing…');
      const body = {
        session_id: sessionId,
        analysis_config: {
          include_vibration:   document.getElementById('chkVib').checked,
          include_force:       document.getElementById('chkForce').checked,
          include_orientation: false,
        },
        se_inputs: {
          operator_count:   parseInt(document.getElementById('opCount').value) || 1,
          shift_duration_s: parseFloat(document.getElementById('shiftHrs').value) * 3600,
        },
      };
      const r = await fetch('/compute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) { setStatus('Compute failed: ' + (await r.text())); return; }
      const data = await r.json();
      setStatus('Done.');
      showResult(data);
    }

    function showResult(d) {
      document.getElementById('resultCard').style.display = 'block';
      const fiveYrSavings = [1,2,3,4,5].reduce((s, n) =>
        s + (d[`y${n}_cost_manual`] - d[`y${n}_cost_robot`]), 0);
      const rows = [
        ['ESH Risk Score — Manual',  d.esh_risk_score_manual.toFixed(1) + ' / 100'],
        ['ESH Risk Score — Robot',   d.esh_risk_score_robot.toFixed(1)  + ' / 100'],
        ['Risk Reduction',           d.risk_reduction_pct.toFixed(1) + '%'],
        ['Annual Injury Cost — Manual', fmt(d.annual_injury_cost_manual)],
        ['Annual Injury Cost — Robot',  fmt(d.annual_injury_cost_robot)],
        ['Annual ESH Savings',       fmt(d.annual_esh_savings_usd)],
        ['5-Year Cumulative Savings', fmt(fiveYrSavings)],
        ['HAVS Onset Estimate',      d.havs_onset_estimate ? d.havs_onset_estimate.toFixed(1) + ' yrs' : 'N/A'],
        ['A(8) exceeds EAV?',        d.compliance_status.a8_exceeds_eav ? '⚠ YES' : 'NO'],
        ['A(8) exceeds ELV?',        d.compliance_status.a8_exceeds_elv ? '⚠ YES' : 'NO'],
        ['SI hazardous?',            d.compliance_status.si_hazardous    ? '⚠ YES' : 'NO'],
      ];
      let html = '<table><tr><th>Metric</th><th>Value</th></tr>';
      for (const [k, v] of rows) html += `<tr><td>${k}</td><td><b>${v}</b></td></tr>`;
      html += '</table>';
      if (d.compliance_status.a8_exceeds_eav || d.compliance_status.si_hazardous) {
        html = '<div class="warn">⚠ Compliance issue detected — manual sanding exceeds regulatory thresholds. See Excel for details.</div>' + html;
      }
      document.getElementById('resultBody').innerHTML = html;
    }

    async function doDownload() {
      if (!sessionId) return;
      const r = await fetch('/excel/' + sessionId);
      if (!r.ok) { alert('Download failed.'); return; }
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = 'esh-savings.xlsx'; a.click();
      URL.revokeObjectURL(url);
    }

    function fmt(v) { return '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
    function setStatus(msg) { document.getElementById('status').textContent = msg; }
  </script>
</body>
</html>
