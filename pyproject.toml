[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esh-savings"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
mcap  = ["mcap>=1.0"]
rerun = ["rerun-sdk>=0.16,<0.18"]
all   = ["esh-savings[mcap,rerun]"]

[project.scripts]
esh-savings = "esh_savings.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esh_savings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
